name: greyson-nl-portfolio
region: ams
domains:
  - domain: greyson.nl
    type: PRIMARY
  - domain: www.greyson.nl
    type: ALIAS
static_sites:
  - name: web
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    error_document: index.html
    routes:
      - path: /
